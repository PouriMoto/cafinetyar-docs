site_name: CafeNet OS - راهنمای خدمات کافینت
site_description: مرجع کامل روال‌های عملیاتی خدمات کافینت
site_author: CafeNet OS

theme:
  name: material
  language: fa
  direction: rtl
  palette:
    primary: teal
    accent: amber
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search:
      lang: 
        - fa

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_css:
  - stylesheets/rtl-fix.css

